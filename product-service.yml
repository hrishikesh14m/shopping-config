server:
  port: 8082

spring:
  application:
    name: product-service
  mongodb:
    uri: mongodb://localhost:27017/shopping_product_db

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka
      register-with-eureka: true
      fetch-registry: true

  management:
    endpoints:
      web:
        exposure:
          include: health,info