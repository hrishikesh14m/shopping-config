server:
  port: 8080

sprint:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          url: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**

        - id: product-service
          url: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products/**